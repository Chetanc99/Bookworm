# Convenience for local/demo use - `docker compose up` gets you backend + MySQL
# with no local Maven/MySQL install needed. Not a production deployment
# topology (no TLS, no secrets manager, single MySQL instance with no backups).
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ugly kitty}
      MYSQL_DATABASE: bookworm_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-ugly kitty}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bookworm_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      JWT_SECRET: ${JWT_SECRET:-bookworm-dev-only-secret-key-change-me-please-32bytes+}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # Compose defaults to 'dev' ddl-auto: update, since this is meant for
      # local/demo spin-up, not a real deployment. Override to prod if needed.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    volumes:
      - uploads_data:/app/uploads

volumes:
  mysql_data:
  uploads_data:
